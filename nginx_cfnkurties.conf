# NGINX Configuration for cfnkurties.in
# Routes WordPress admin/API requests to PHP-FPM / WordPress
# Routes Next.js storefront requests to Port 3000

server {
    listen 80;
    server_name cfnkurties.in www.cfnkurties.in;

    # Redirect HTTP to HTTPS (Handled by Cloudflare SSL Flexible/Full)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name cfnkurties.in www.cfnkurties.in;

    # Cloudflare Origin SSL Certificates
    ssl_certificate /etc/ssl/certs/cfnkurties.crt;
    ssl_certificate_key /etc/ssl/private/cfnkurties.key;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Max upload size for product imagery & assets
    client_max_body_size 64M;

    # 1. WordPress Admin & WooCommerce REST API routes -> PHP-FPM
    location ~ ^/(wp-admin|wp-json|wp-content|wp-includes|xmlrpc\.php|wp-login\.php) {
        root /var/www/wordpress;
        index index.php;

        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        }
    }

    # 2. Next.js Storefront (All other frontend routes) -> Port 3000
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cache_bypass $http_upgrade;
    }
}
